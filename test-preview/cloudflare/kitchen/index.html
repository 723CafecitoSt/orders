<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>723 Kitchen - local demonstration</title><style>
body{font:18px system-ui;background:#f5f2e9;color:#222;margin:0}header{background:#202020;color:white;padding:1rem}main{padding:1rem;max-width:70rem;margin:auto}button,select{font:inherit;padding:.65rem;margin:.25rem;border-radius:.4rem}article{background:white;padding:1rem;border-radius:.6rem;margin:1rem 0;box-shadow:0 2px 6px #0002}li{margin:.5rem 0}.badge{background:#ffe18b;padding:.2rem .5rem}#ticket{display:none;white-space:pre-wrap}@media print{body>*{display:none!important}#ticket{display:block!important;position:absolute;top:0;left:0;width:80mm;font:12pt monospace} @page{size:80mm auto;margin:3mm}}
</style></head><body><header><strong>723 Kitchen</strong> · SIMULATION ONLY</header><main><p>Sample orders stay on this device. No live orders or payments are connected.</p><label>Station <select id="station"><option value="beverages">Beverages</option><option value="food">Waffles / Food</option></select></label><button id="print">Print sample ticket</button><section id="list"></section></main><pre id="ticket"></pre><script type="module">
import {stationItems,ticketText,setStatus} from './kitchen.mjs';
const orders=[{number:'101',items:[{id:'sample-drink',station:'beverages',name:'Iced Latte',quantity:2,modifiers:['Oat Milk','Caramel','Light Ice'],note:'No sugar',status:'new'},{id:'sample-waffle',station:'food',name:'Waffle',quantity:1,modifiers:['Banana','Nutella'],note:'Sauce on side',status:'new'}]}];
const list=document.querySelector('#list'),station=document.querySelector('#station');function render(){list.replaceChildren();for(const o of orders){let items=stationItems(o,station.value);if(!items.length)continue;let card=document.createElement('article'),title=document.createElement('h2');title.textContent='Order #'+o.number;card.append(title);for(const item of items){let row=document.createElement('div'),p=document.createElement('p');p.textContent=`${item.quantity} × ${item.name} — ${item.status.toUpperCase()}`;row.append(p);let details=document.createElement('p');details.textContent=[...item.modifiers,item.note?'Note: '+item.note:''].filter(Boolean).join(' · ');row.append(details);for(const status of ['preparing','ready']){let b=document.createElement('button');b.textContent=status==='ready'?'Ready':'Preparing';b.disabled=item.status===status||item.status==='ready';b.addEventListener('click',()=>{setStatus(o,item.id,status);render()});row.append(b)}card.append(row)}list.append(card)}}station.addEventListener('change',render);document.querySelector('#print').addEventListener('click',()=>{document.querySelector('#ticket').textContent=ticketText(orders[0],station.value);window.print()});render();
</script></body></html>
