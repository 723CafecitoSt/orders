<!doctype html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-6f20w1izdi+rD3MOo5VTI9aNj+6Fg05exqDsJ5Orq28='; connect-src 'self' https://orders-api-test.723cafecitost.com https://127.0.0.1:8797; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>723 Kitchen · Test</title><script src="../../test-backend-config.js"></script><style>
body{font:18px system-ui;background:#f5f2e9;color:#222;margin:0}header{background:#222;color:white;padding:1rem}main{max-width:90rem;margin:auto;padding:1rem}button,input,select{font:inherit;padding:.6rem;margin:.2rem}article{background:white;padding:1rem;margin:1rem 0;border-radius:.6rem;border:1px solid #ddd}.identity{display:flex;gap:1rem;flex-wrap:wrap}.number{padding:.6rem 1rem;border-radius:.5rem;min-width:150px}.order-number{background:#ffe17b}.pager-number{background:#d8eaff}.number small{display:block;font-weight:800;font-size:14px;letter-spacing:2px}.number strong{font-size:44px;line-height:1.2}.product{padding:.7rem 0;border-top:1px solid #ddd}.order-state{font-size:22px;font-weight:800}.delivered{opacity:.75}.note{white-space:pre-wrap}button:disabled{opacity:.4}
</style></head><body><header>723 Kitchen · TEST DATA · PAYMENTS DISABLED</header><main><p id="state">Sign in to the isolated test backend</p><form id="login"><input id="user" placeholder="Test username" autocomplete="username" required><input id="pass" type="password" placeholder="Test password" autocomplete="current-password" required><button>Sign in</button></form><label>View <select id="station"><option value="all">Unified · Beverages + Food</option><option value="beverages">Beverages</option><option value="food">Food</option></select></label><label><input type="checkbox" id="showDelivered"> Include Delivered</label><button id="refresh">Refresh</button><button id="logout">Sign out</button><button id="newest">Newest</button><button id="newer">Newer</button><button id="older">Older</button><section id="list"></section></main><script type="module">
import {createTestClient} from '../src/test-client.mjs';
const config=window.ORDER_STATION_TEST_CONFIG||{},local=location.hostname==='test.localhost'&&new URLSearchParams(location.search).get('localApi')==='1';let client=createTestClient({enabled:local||config.enabled===true,baseUrl:local?'https://127.0.0.1:8797':config.apiBaseUrl,frontendOrigin:config.frontendOrigin}),signed=false,busy=false,cursor=null,nextCursor=null,previous=[],permissions=[];const $=x=>document.getElementById(x),list=$('list');
const admin=()=>permissions.includes('administrator'),cashier=()=>admin()||permissions.includes('cashier'),canUpdate=station=>admin()||permissions.includes(station);
function identity(label,value,kind){let block=document.createElement('div'),tag=document.createElement('small'),number=document.createElement('strong');block.className='number '+kind;tag.textContent=label;number.textContent=value??'—';block.append(tag,number);return block}
function message(e){return e.code==='pager_in_use'?`Pager ${e.pagerNumber} is in use by order #${e.conflictingOrderNumber}. Choose a different pager or resolve that order first.`:e.message}
async function refresh(){if(!signed||busy)return;busy=true;try{let data=await client.kitchenOrders($('station').value,cursor,$('showDelivered').checked);nextCursor=data.nextCursor;$('older').disabled=!nextCursor;$('newer').disabled=!previous.length;list.replaceChildren();for(let order of data.orders){let box=document.createElement('article'),numbers=document.createElement('div'),status=document.createElement('p');box.className=order.status==='delivered'?'delivered':'';numbers.className='identity';numbers.append(identity('ORDER',order.number,'order-number'),identity('PAGER',order.pagerNumber,'pager-number'));status.className='order-state';status.textContent='Order status: '+order.status.toUpperCase();box.append(numbers,status);if(order.orderNote){let note=document.createElement('p');note.className='note';note.textContent='Order note: '+order.orderNote;box.append(note)}
 for(let item of order.items){let row=document.createElement('div'),title=document.createElement('strong'),details=document.createElement('p');row.className='product';title.textContent=`${item.station==='food'?'FOOD':'BEVERAGES'} · ${item.quantity} × ${item.name} · ${item.status.toUpperCase()}`;details.className='note';details.textContent=[...item.modifiers,item.note?'Note: '+item.note:''].filter(Boolean).join(' · ');row.append(title,details);for(let state of ['preparing','ready']){let button=document.createElement('button');button.textContent=state==='ready'?'Ready':'Preparing';button.disabled=order.status==='delivered'||item.status==='ready'||item.status===state||!canUpdate(item.station);button.onclick=async()=>{button.disabled=true;try{await client.kitchenStatus(order.id,item.lineIndex,item.version,state);await refresh()}catch(e){$('state').textContent='Update not confirmed: '+message(e)+' Refresh to see the current state.'}};row.append(button)}box.append(row)}
 if(cashier()&&order.status!=='delivered'){let pager=document.createElement('input'),assign=document.createElement('button'),deliver=document.createElement('button');pager.type='text';pager.inputMode='numeric';pager.maxLength=4;pager.placeholder='Optional pager (1–9999)';pager.value=order.pagerNumber||'';pager.setAttribute('aria-label','Pager for order '+order.number);assign.textContent='Update Pager';assign.onclick=async()=>{assign.disabled=true;try{await client.assignPager(order.id,pager.value,order.fulfillmentVersion);await refresh()}catch(e){assign.disabled=false;$('state').textContent=message(e)}};deliver.textContent='Delivered · Release Pager';deliver.disabled=order.status!=='ready';deliver.onclick=async()=>{if(!confirm(`Deliver order #${order.number} and release pager ${order.pagerNumber||'—'}?`))return;deliver.disabled=true;try{await client.deliver(order.id,order.fulfillmentVersion);await refresh()}catch(e){$('state').textContent='Delivery not confirmed: '+message(e)+' Refresh before retrying.'}};box.append(pager,assign,deliver)}list.append(box)}$('state').textContent='Connected · order and pager data update every 5 seconds'}catch(e){if(e.status===401){signed=false;list.replaceChildren()}$('state').textContent=e.status===401?'Session expired; sign in again.':'Disconnected · displayed data may be stale. Retrying. '+e.message}finally{busy=false}}
$('login').onsubmit=async e=>{e.preventDefault();try{let staff=await client.login($('user').value,$('pass').value);$('pass').value='';permissions=staff.permissions;for(let option of $('station').options)option.disabled=option.value==='all'?!(cashier()||(permissions.includes('beverages')&&permissions.includes('food'))):!(cashier()||permissions.includes(option.value));let first=[...$('station').options].find(o=>!o.disabled);if(!first)throw Error('No kitchen permission');$('station').value=first.value;cursor=null;previous=[];signed=true;await refresh()}catch(e){$('state').textContent='Sign in failed: '+e.message}};
$('logout').onclick=async()=>{let confirmed=true;try{await client.logout()}catch{confirmed=false}finally{signed=false;permissions=[];list.replaceChildren();$('state').textContent=confirmed?'Signed out.':'Signed out locally. Server revocation was not confirmed; the session expires automatically.'}};function newest(){if(busy)return;cursor=null;previous=[];refresh()}$('station').onchange=newest;$('showDelivered').onchange=newest;$('newest').onclick=newest;$('refresh').onclick=refresh;$('older').onclick=()=>{if(!busy&&nextCursor){previous.push(cursor);cursor=nextCursor;refresh()}};$('newer').onclick=()=>{if(!busy&&previous.length){cursor=previous.pop();refresh()}};setInterval(refresh,5000);
</script></body></html>
