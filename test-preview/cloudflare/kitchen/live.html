<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>723 Kitchen Local Test</title><style>body{font:18px system-ui;background:#f5f2e9;color:#222;margin:0}header{background:#222;color:white;padding:1rem}main{max-width:70rem;margin:auto;padding:1rem}button,input,select{font:inherit;padding:.6rem;margin:.2rem}article{background:white;padding:1rem;margin:1rem 0;border-radius:.5rem}small{color:#4c473c}</style></head><body><header>723 Kitchen · LOCAL TEST ONLY</header><main><p id="state">Sign in to local test backend</p><form id="login"><input id="user" placeholder="Test username" autocomplete="username" required><input id="pass" type="password" placeholder="Test password" autocomplete="current-password" required><button>Sign in</button></form><label>Station <select id="station"><option value="beverages">Beverages</option><option value="food">Food</option></select></label><button id="refresh">Refresh</button><section id="list"></section></main><script type="module">
import {createTestClient} from '../src/test-client.mjs';
let client=createTestClient({enabled:true,baseUrl:'https://127.0.0.1:8797'}),signed=false,busy=false;const $=x=>document.getElementById(x),list=$('list');
async function refresh(){if(!signed||busy)return;busy=true;try{let data=await client.kitchen($('station').value);list.replaceChildren();for(let item of data.items){let box=document.createElement('article'),title=document.createElement('strong'),details=document.createElement('p');title.textContent=`Order ${item.orderId} · ${item.quantity} × ${item.name} · ${item.status}`;details.textContent=[...item.modifiers,item.note?'Note: '+item.note:''].filter(Boolean).join(' · ');box.append(title,details);for(let status of ['preparing','ready']){let button=document.createElement('button');button.textContent=status;button.disabled=item.status==='ready'||item.status===status;button.onclick=async()=>{try{await client.kitchenStatus(item.orderId,item.lineIndex,item.version,status)}catch(e){$('state').textContent='Update failed; refreshing: '+e.message}await refresh()};box.append(button)}list.append(box)}$('state').textContent='Connected · updates every 5 seconds'}catch(e){$('state').textContent='Disconnected · retrying. '+e.message}finally{busy=false}}
$('login').onsubmit=async e=>{e.preventDefault();try{await client.login($('user').value,$('pass').value);$('pass').value='';signed=true;await refresh()}catch(e){$('state').textContent='Sign in failed: '+e.message}};$('station').onchange=refresh;$('refresh').onclick=refresh;setInterval(refresh,5000);
</script></body></html>
