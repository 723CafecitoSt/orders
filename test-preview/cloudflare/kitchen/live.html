import {createTestClient} from '../src/test-client.mjs';
const config=window.ORDER_STATION_TEST_CONFIG||{},local=location.hostname==='test.localhost'&&new URLSearchParams(location.search).get('localApi')==='1';let client=createTestClient({enabled:local||config.enabled===true,baseUrl:local?'https://127.0.0.1:8797':config.apiBaseUrl,frontendOrigin:config.frontendOrigin}),signed=false,busy=false,cursor=null,nextCursor=null,previous=[];const $=x=>document.getElementById(x),list=$('list');
async function refresh(){if(!signed||busy)return;busy=true;try{let data=await client.kitchen($('station').value,cursor);nextCursor=data.nextCursor;$('older').disabled=!nextCursor;$('newer').disabled=!previous.length;list.replaceChildren();for(let item of data.items){let box=document.createElement('article'),title=document.createElement('strong'),details=document.createElement('p');title.textContent=`Order #${item.number} · ${item.quantity} × ${item.name} · ${item.status}`;details.textContent=[...item.modifiers,item.note?'Note: '+item.note:'',item.orderNote?'Order note: '+item.orderNote:''].filter(Boolean).join(' · ');box.append(title,details);for(let status of ['preparing','ready']){let button=document.createElement('button');button.textContent=status;button.disabled=item.status==='ready'||item.status===status;button.onclick=async()=>{try{await client.kitchenStatus(item.orderId,item.lineIndex,item.version,status)}catch(e){$('state').textContent='Update failed; refreshing: '+e.message}await refresh()};box.append(button)}list.append(box)}$('state').textContent='Connected · updates every 5 seconds'}catch(e){if(e.status===401){signed=false;list.replaceChildren()}$('state').textContent=e.status===401?'Session expired; sign in again.':'Disconnected · displayed data may be stale. Retrying. '+e.message}finally{busy=false}}
$('login').onsubmit=async e=>{e.preventDefault();try{let staff=await client.login($('user').value,$('pass').value);$('pass').value='';for(let option of $('station').options)option.disabled=!staff.permissions.includes('administrator')&&!staff.permissions.includes(option.value);let first=[...$('station').options].find(o=>!o.disabled);if(!first)throw Error('No kitchen permission');$('station').value=first.value;cursor=null;previous=[];signed=true;await refresh()}catch(e){$('state').textContent='Sign in failed: '+e.message}};$('logout').onclick=async()=>{try{await client.logout()}finally{signed=false;list.replaceChildren();$('state').textContent='Signed out.'}};$('station').onchange=()=>{if(busy)return;cursor=null;previous=[];refresh()};$('refresh').onclick=refresh;$('older').onclick=()=>{if(!busy&&nextCursor){previous.push(cursor);cursor=nextCursor;refresh()}};$('newer').onclick=()=>{if(!busy&&previous.length){cursor=previous.pop();refresh()}};setInterval(refresh,5000);
</script></body></html>
